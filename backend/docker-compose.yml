version: '3.8'

services:
  safercall-api:
    build: .
    container_name: safercall-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG_MODE=False
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    networks:
      - safercall-network

  redis:
    image: redis:7-alpine
    container_name: safercall-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - safercall-network

  postgres:
    image: postgres:15-alpine
    container_name: safercall-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-safercall}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-securepassword}
      - POSTGRES_DB=${DB_NAME:-safercall_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - safercall-network

networks:
  safercall-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
